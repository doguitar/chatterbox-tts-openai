<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatterbox TTS</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 1.5rem; }
    main { max-width: 720px; margin: 0 auto; }
    nav { margin-bottom: 1.25rem; }
    nav a { color: #9cf; margin-right: 1rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; }
    select, textarea, input, button { font: inherit; }
    select, textarea, input[type="text"] {
      width: 100%; box-sizing: border-box; background: #1c1c1c; color: #eee;
      border: 1px solid #444; padding: 0.5rem;
    }
    textarea { min-height: 8rem; }
    .row { display: flex; gap: 0.5rem; align-items: center; }
    .row select { flex: 1; }
    button { background: #2a4a7a; color: #fff; border: 0; padding: 0.5rem 0.9rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    #status { min-height: 1.4em; }
    #player, #download { display: none; margin-top: 0.75rem; }
    #download { color: #9cf; }
  </style>
</head>
<body>
  <main>
    <nav><a href="/">Speak</a><a href="/clone">Clone</a><a href="/config">Config</a></nav>
    <h1>Speak</h1>
    <p>Voices are reference-WAV presets (plus <code>default</code> on english/multilingual). Turbo/Nano accept paralinguistic tags such as <code>[laugh]</code>.</p>
    <label for="voice">Voice</label>
    <div class="row">
      <select id="voice"></select>
      <button type="button" id="rescan">Rescan models</button>
    </div>
    <label for="text">Text</label>
    <textarea id="text" required></textarea>
    <label for="language">Language id (multilingual)</label>
    <input id="language" type="text" placeholder="en">
    <p><button type="button" id="generate">Generate</button></p>
    <p id="status"></p>
    <audio id="player" controls></audio>
    <a id="download" download="clip.wav">Download WAV</a>
  </main>
  <script>
    const voiceEl = document.getElementById("voice");
    const textEl = document.getElementById("text");
    const languageEl = document.getElementById("language");
    const generateBtn = document.getElementById("generate");
    const statusEl = document.getElementById("status");
    const player = document.getElementById("player");
    const download = document.getElementById("download");
    let objectUrl = null;

    function fillVoices(data) {
      const rows = data.data || [];
      voiceEl.innerHTML = "";
      for (const row of rows) {
        const opt = document.createElement("option");
        opt.value = row.voice_id;
        opt.textContent = row.voice_id + (row.kind === "voice_clone" ? " (ref)" : "");
        if (row.voice_id === data.default) opt.selected = true;
        voiceEl.appendChild(opt);
      }
    }

    fetch("/v1/voices").then((r) => r.json()).then(fillVoices).catch((err) => {
      statusEl.textContent = String(err);
    });
    document.getElementById("rescan").addEventListener("click", async () => {
      statusEl.textContent = "rescanning…";
      try {
        const res = await fetch("/ui/rescan", { method: "POST" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          statusEl.textContent = data.detail || ("http " + res.status);
          return;
        }
        const voices = await fetch("/v1/voices").then((r) => r.json());
        fillVoices(voices);
        statusEl.textContent = "packs: " + ((data.models || []).map((m) => m.id).join(", ") || "none");
      } catch (err) {
        statusEl.textContent = String(err);
      }
    });

    generateBtn.addEventListener("click", async () => {
      const text = textEl.value.trim();
      if (!text) { statusEl.textContent = "empty input"; return; }
      generateBtn.disabled = true;
      statusEl.textContent = "generating…";
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      const body = {
        model: "tts-1",
        voice: voiceEl.value,
        input: text,
        response_format: "wav",
      };
      if (languageEl.value.trim()) body.language = languageEl.value.trim();
      try {
        const res = await fetch("/v1/audio/speech", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          statusEl.textContent = err.detail || ("http " + res.status);
          return;
        }
        const blob = await res.blob();
        objectUrl = URL.createObjectURL(blob);
        player.src = objectUrl;
        player.style.display = "block";
        download.href = objectUrl;
        download.style.display = "inline";
        statusEl.textContent = "voice " + (res.headers.get("x-tts-voice-used") || voiceEl.value);
      } catch (err) {
        statusEl.textContent = String(err);
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
