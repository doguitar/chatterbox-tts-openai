<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clone</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 1.5rem; }
    main { max-width: 720px; margin: 0 auto; }
    nav { margin-bottom: 1.25rem; }
    nav a { color: #9cf; margin-right: 1rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; }
    textarea, input, button { font: inherit; }
    textarea, input[type="text"] {
      width: 100%; box-sizing: border-box; background: #1c1c1c; color: #eee;
      border: 1px solid #444; padding: 0.5rem;
    }
    textarea { min-height: 6rem; }
    button { background: #2a4a7a; color: #fff; border: 0; padding: 0.5rem 0.9rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    #status { min-height: 1.4em; }
    #player, #download { display: none; margin-top: 0.75rem; }
    #download { color: #9cf; }
  </style>
</head>
<body>
  <main>
    <nav><a href="/">Speak</a><a href="/clone">Clone</a><a href="/config">Config</a></nav>
    <h1>One-shot clone</h1>
    <p>Uploads a reference WAV for this request only. Chatterbox clones from the audio; the transcript is required by the API and stored only for the request.</p>
    <label for="text">Text</label>
    <textarea id="text" required></textarea>
    <label for="ref_text">Transcript of the reference wav</label>
    <textarea id="ref_text" required></textarea>
    <label for="ref_audio">Reference wav</label>
    <input id="ref_audio" type="file" accept="audio/wav,.wav" required>
    <p><button type="button" id="generate">Generate</button></p>
    <p id="status"></p>
    <audio id="player" controls></audio>
    <a id="download" download="clip.wav">Download WAV</a>
  </main>
  <script>
    const textEl = document.getElementById("text");
    const refTextEl = document.getElementById("ref_text");
    const refAudioEl = document.getElementById("ref_audio");
    const generateBtn = document.getElementById("generate");
    const statusEl = document.getElementById("status");
    const player = document.getElementById("player");
    const download = document.getElementById("download");
    let objectUrl = null;
    generateBtn.addEventListener("click", async () => {
      const text = textEl.value.trim();
      const refText = refTextEl.value.trim();
      const file = refAudioEl.files && refAudioEl.files[0];
      if (!text || !refText || !file) {
        statusEl.textContent = "clone requires a wav and transcript";
        return;
      }
      generateBtn.disabled = true;
      statusEl.textContent = "generating…";
      const form = new FormData();
      form.append("input", text);
      form.append("voice", "clone");
      form.append("ref_text", refText);
      form.append("ref_audio", file);
      form.append("response_format", "wav");
      try {
        const res = await fetch("/v1/audio/speech", { method: "POST", body: form });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          statusEl.textContent = err.detail || ("http " + res.status);
          return;
        }
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        const blob = await res.blob();
        objectUrl = URL.createObjectURL(blob);
        player.src = objectUrl;
        player.style.display = "block";
        download.href = objectUrl;
        download.style.display = "inline";
        statusEl.textContent = "ok";
      } catch (err) {
        statusEl.textContent = String(err);
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
